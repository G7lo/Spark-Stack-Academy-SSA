<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Login | Spark Stack Academy</title>

<link rel="stylesheet" href="css/auth.css">

</head>

<body>

<div class="login-container">

<div class="login-card">

<h1>Spark Stack Academy</h1>

<p>Welcome back. Continue your learning journey.</p>

<form id="loginForm">

<input
type="email"
id="email"
placeholder="Email Address"
required>

<input
type="password"
id="password"
placeholder="Password"
required>

<button
type="submit"
id="loginBtn">

Login

</button>

</form>

<div class="links">

<a href="signup.html">

Create Account

</a>

</div>

</div>

</div>

<script type="module"
src="js/login.js"></script>

</body>

</html>
