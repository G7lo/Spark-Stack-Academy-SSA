<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | Spark Stack Academy</title>
<meta name="description" content="Login to your Spark Stack Academy account and continue your learning journey.">
<link rel="stylesheet" href="css/auth.css">
<link rel="stylesheet" href="css/clerk-auth.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>
<a href="index.html" class="back-home"><i class="fa-solid fa-arrow-left"></i><span>Back Home</span></a>
<div class="auth-background"><div class="bg-circle circle-one"></div><div class="bg-circle circle-two"></div><div class="bg-circle circle-three"></div></div>
<main class="login-container">
<div class="login-card">
<div class="brand-logo"><img src="assets/images/ssa-logo.png" alt="Spark Stack Academy Logo"></div>
<div class="welcome-badge"><i class="fa-solid fa-graduation-cap"></i> Welcome Back</div>
<h1>Login to Your Account</h1>
<p>Continue learning, building and innovating with Spark Stack Academy.</p>
<form id="loginForm" autocomplete="on" aria-hidden="true">
<input type="email" id="email"><input type="password" id="password"><button type="submit" id="loginBtn">Login</button>
</form>
</div>
</main>
<div id="authLoader" class="auth-loader"><div class="loader-box"><img src="assets/images/ssa-logo.png" alt="Spark Stack Academy Logo"><h2 id="loaderText">Securely signing you in...</h2><p>Verifying your secure session.</p><div class="progress-track"><div class="progress-energy"><span></span></div></div></div></div>
<div id="toastContainer" class="toast-container"></div>
<button id="scrollTopBtn" class="scroll-top" type="button" aria-label="Scroll to Top"><i class="fa-solid fa-arrow-up"></i></button>
<script type="module" src="js/login.js"></script>
</body>
</html>
