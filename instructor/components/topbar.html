<!-- ============================================
     SPARK STACK ACADEMY
     INSTRUCTOR TOPBAR V1
============================================ --><div class="instructor-topbar-inner"><!-- LEFT -->

<div class="topbar-left">


    <!-- MOBILE MENU -->

    <button
        class="topbar-menu"
        id="instructorMenuBtn"
        type="button"
        aria-label="Open navigation"
    >

        <i data-lucide="menu"></i>

    </button>


    <!-- PAGE CONTEXT -->

    <div class="topbar-context">

        <span>
            INSTRUCTOR PORTAL
        </span>

        <strong id="topbarPageTitle">
            Dashboard
        </strong>

    </div>

</div>



<!-- RIGHT -->

<div class="topbar-right">


    <!-- SEARCH -->

    <button
        class="topbar-icon-btn"
        id="instructorSearchBtn"
        type="button"
        aria-label="Search"
    >

        <i data-lucide="search"></i>

    </button>


    <!-- NOTIFICATIONS -->

    <a
        href="notifications.html"
        class="topbar-icon-btn notification-btn"
        aria-label="Notifications"
    >

        <i data-lucide="bell"></i>

        <span
            class="notification-dot"
            id="notificationDot"
        ></span>

    </a>


    <!-- DIVIDER -->

    <span class="topbar-divider"></span>


    <!-- PROFILE -->

    <a
        href="profile.html"
        class="topbar-profile"
    >

        <div class="topbar-avatar">

            <span id="topbarInitial">
                I
            </span>

        </div>


        <div class="topbar-profile-info">

            <strong id="topbarInstructorName">
                Instructor
            </strong>

            <span>
                Instructor
            </span>

        </div>


        <i data-lucide="chevron-down"></i>

    </a>

</div>

</div>
