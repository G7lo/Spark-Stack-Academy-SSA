<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Create Assignment | Spark Stack Academy
    </title>

    <link
        rel="stylesheet"
        href="css/instructor-core.css"
    >

    <link
        rel="stylesheet"
        href="css/components.css"
    >

    <link
        rel="stylesheet"
        href="css/create-assignment.css"
    >

    <link
        rel="stylesheet"
        href="css/responsive.css"
    >

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <script src="https://unpkg.com/lucide@latest"></script>

</head>


<body>

<div class="instructor-app">


    <!-- SIDEBAR -->

    <aside
        id="instructorSidebar"
        class="instructor-sidebar"
    ></aside>


    <!-- OVERLAY -->

    <div
        id="sidebarOverlay"
        class="sidebar-overlay"
    ></div>


    <!-- MAIN -->

    <main class="instructor-main">


        <!-- TOPBAR -->

        <header
            id="instructorTopbar"
            class="instructor-topbar"
        ></header>


        <!-- PAGE -->

        <section class="create-assignment-page">


            <!-- HEADER -->

            <div class="page-header">

                <div>

                    <span class="page-eyebrow">
                        TEACHING
                    </span>

                    <h1>
                        Create Assignment
                    </h1>

                    <p>
                        Create a task for students
                        enrolled in your course.
                    </p>

                </div>


                <a
                    href="assignments.html"
                    class="secondary-btn"
                >

                    <i data-lucide="arrow-left"></i>

                    Back to Assignments

                </a>

            </div>


            <!-- FORM -->

            <form
                id="assignmentForm"
                class="assignment-form"
            >


                <!-- BASIC INFORMATION -->

                <section class="form-card">

                    <div class="form-card-header">

                        <span>
                            ASSIGNMENT DETAILS
                        </span>

                        <h2>
                            Basic Information
                        </h2>

                    </div>


                    <div class="form-grid">


                        <div class="form-group full">

                            <label for="assignmentTitle">
                                Assignment Title
                            </label>

                            <input
                                type="text"
                                id="assignmentTitle"
                                placeholder="e.g. Build a Responsive Landing Page"
                                required
                            >

                        </div>


                        <div class="form-group full">

                            <label for="assignmentDescription">
                                Instructions
                            </label>

                            <textarea
                                id="assignmentDescription"
                                rows="7"
                                placeholder="Explain what students need to do..."
                                required
                            ></textarea>

                        </div>


                        <div class="form-group">

                            <label for="courseSelect">
                                Course
                            </label>

                            <select
                                id="courseSelect"
                                required
                            >

                                <option value="">
                                    Select a course
                                </option>

                            </select>

                        </div>


                        <div class="form-group">

                            <label for="dueDate">
                                Due Date
                            </label>

                            <input
                                type="datetime-local"
                                id="dueDate"
                            >

                        </div>


                        <div class="form-group">

                            <label for="maxScore">
                                Maximum Score
                            </label>

                            <input
                                type="number"
                                id="maxScore"
                                min="1"
                                value="100"
                                required
                            >

                        </div>


                    </div>

                </section>


                <!-- ACTIONS -->

                <section class="form-actions">

                    <a
                        href="assignments.html"
                        class="secondary-btn"
                    >
                        Cancel
                    </a>


                    <button
                        type="submit"
                        id="saveAssignmentBtn"
                        class="primary-btn"
                    >

                        <i data-lucide="save"></i>

                        Create Assignment

                    </button>

                </section>


                <!-- MESSAGE -->

                <div
                    id="formMessage"
                    class="form-message"
                    hidden
                ></div>


            </form>

        </section>

    </main>

</div>


<script
    type="module"
    src="js/instructor-app.js"
></script>

<script
    type="module"
    src="js/create-assignment.js"
></script>

<script>
    lucide.createIcons();
</script>

</body>

</html>
