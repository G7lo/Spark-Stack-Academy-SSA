<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Report an Issue | Spark Stack Academy</title><link rel="stylesheet" href="css/instructor-core.css"><link rel="stylesheet" href="css/components.css"><link rel="stylesheet" href="css/responsive.css"><script src="https://unpkg.com/lucide@latest"></script><style>
.report-page{max-width:1000px;margin:auto;padding:32px}.report-card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:24px;padding:28px;margin-bottom:22px}.report-page p{color:#94a3b8}.report-form{display:grid;gap:16px}.report-form label{display:grid;gap:7px;color:#cbd5e1;font-weight:600}.report-form input,.report-form select,.report-form textarea{box-sizing:border-box;width:100%;padding:13px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.1);background:#0b172b;color:inherit}.report-form textarea{min-height:150px}.report-form button{border:0;border-radius:12px;padding:14px 18px;background:#2979ff;color:#fff;font-weight:800}.report-result{margin-top:14px;padding:14px;border-radius:12px;background:rgba(41,121,255,.1);color:#dbeafe}.report-history-item{padding:16px;border:1px solid rgba(255,255,255,.07);border-radius:14px;margin-top:10px}.report-history-item>div{display:flex;justify-content:space-between;gap:15px}.report-history-item span{display:block;color:#94a3b8;margin-top:4px}.report-status{font-size:12px;text-transform:capitalize}.report-status.resolved{color:#4ade80}.report-status.pending{color:#fbbf24}.report-status.reviewing{color:#60a5fa}.report-empty{padding:25px;text-align:center;color:#94a3b8}
</style></head><body><div class="instructor-app"><aside id="instructorSidebar" class="instructor-sidebar"></aside><div id="sidebarOverlay" class="sidebar-overlay"></div><main class="instructor-main"><header id="instructorTopbar" class="instructor-topbar"></header><section class="report-page"><div class="report-card"><span>SPARK SUPPORT</span><h1>Report an issue</h1><p>Submit a case to Academy Admin and the Founder. You'll receive a case ID and feedback here.</p><form id="reportForm" class="report-form"><label>Title<input id="reportTitle" required maxlength="120" placeholder="What happened?"></label><label>Category<select id="reportCategory"><option value="technical">Technical issue</option><option value="student">Student issue</option><option value="course">Course</option><option value="payment">Payment</option><option value="account">Account</option><option value="safety">Safety</option><option value="general">General</option></select></label><label>Priority<select id="reportPriority"><option value="low">Low</option><option value="medium" selected>Medium</option><option value="high">High</option><option value="critical">Critical</option></select></label><label>Description<textarea id="reportDescription" required placeholder="Explain the issue clearly..."></textarea></label><input id="reportedUserId" type="hidden"><input id="courseId" type="hidden"><button type="submit">Submit Report</button></form><div id="reportResult" class="report-result" aria-live="polite"></div></div><div class="report-card"><h2>My Reports</h2><p>Track case status and leadership feedback.</p><div id="myReports"><div class="report-empty">Loading reports...</div></div></div></section></main></div><script type="module" src="js/instructor-app.js"></script><script type="module" src="../js/report-page.js"></script><script>document.addEventListener('DOMContentLoaded',()=>window.lucide?.createIcons());</script></body></html>
