<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">


<title>
Chat | Spark Stack Academy
</title>


<!-- CORE -->

<link rel="stylesheet"
href="css/student-core.css">

<link rel="stylesheet"
href="css/components.css">

<link rel="stylesheet"
href="css/chat.css">

<link rel="stylesheet"
href="css/responsive.css">



<!-- FONT -->

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
rel="stylesheet">



<script src="https://unpkg.com/lucide@latest"></script>


</head>


<body>



<!-- =================================
     CHAT FULL SCREEN APP
================================= -->


<div class="chat-page">





<!-- =================================
     HEADER
================================= -->


<header class="chat-header">


<div class="chat-left">


<button
id="backBtn"
class="header-btn">

<i data-lucide="arrow-left"></i>

</button>




<div class="chat-avatar">


<img

id="chatAvatar"

src="../assets/images/ssa-logo.png"

alt="User">


<span
id="onlineDot"
class="online-dot">

</span>


</div>





<div class="chat-user">


<h3 id="chatName">

Loading...

</h3>



<p id="chatStatus">

Offline

</p>


</div>



</div>





<div class="chat-actions">


<button
id="voiceCallBtn"
class="header-btn">

<i data-lucide="phone"></i>

</button>




<button
id="videoCallBtn"
class="header-btn">

<i data-lucide="video"></i>

</button>




<button
id="chatMenuBtn"
class="header-btn">

<i data-lucide="more-vertical"></i>

</button>



</div>


</header>








<!-- =================================
     CHAT CONTENT
================================= -->


<main class="chat-body">


<div

id="chatMessages"

class="chat-messages">



<div class="date-divider">

<span>

Today

</span>

</div>



</div>





<!-- TYPING -->


<div

id="typingIndicator"

class="typing-indicator hidden">


<div class="typing-bubble">

<span></span>

<span></span>

<span></span>

</div>


<p>

Typing...

</p>


</div>




</main>









<!-- =================================
     MESSAGE INPUT
================================= -->


<footer class="chat-composer">


<button
id="emojiBtn"
class="composer-btn">

<i data-lucide="smile"></i>

</button>





<button
id="attachBtn"
class="composer-btn">

<i data-lucide="paperclip"></i>

</button>



<input

type="file"

id="fileInput"

hidden>






<textarea

id="messageInput"

placeholder="Type a message..."

rows="1">

</textarea>






<button
id="cameraBtn"
class="composer-btn">

<i data-lucide="camera"></i>

</button>






<button
id="voiceBtn"
class="composer-btn">

<i data-lucide="mic"></i>

</button>






<button
id="sendBtn"
class="send-btn">

<i data-lucide="send-horizontal"></i>

</button>



</footer>









<!-- =================================
     UPLOAD PREVIEW
================================= -->


<div

id="uploadPreview"

class="upload-preview hidden">


<div class="preview-info">


<i data-lucide="file"></i>


<span id="fileName">

No file selected

</span>


</div>




<button

id="removeFileBtn">


<i data-lucide="x"></i>


</button>



</div>





</div>









<!-- =================================
     SCRIPTS
================================= -->


<script
type="module"
src="js/student-app.js">
</script>



<script
type="module"
src="js/messages/chat.js">
</script>



<script
type="module"
src="js/messages/presence.js">
</script>



<script
type="module"
src="js/messages/typing.js">
</script>



<script
type="module"
src="js/messages/uploads.js">
</script>





<script>

lucide.createIcons();


</script>



</body>

</html>
