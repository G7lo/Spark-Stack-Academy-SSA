<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>
Premium Activated | Spark Stack Academy
</title>

<link
    rel="stylesheet"
    href="css/student-core.css"
>

<link
    rel="stylesheet"
    href="css/components.css"
>

<link
    rel="stylesheet"
    href="css/premium.css"
>

<style>

.success-page {

    min-height:100vh;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:25px;

}

.success-card {

    width:100%;
    max-width:520px;

    background:#fff;

    border:1px solid #e8edf5;

    border-radius:28px;

    padding:45px 30px;

    text-align:center;

    box-shadow:0 20px 60px rgba(8,28,58,.10);

}

.success-icon {

    width:80px;
    height:80px;

    margin:0 auto 25px;

    border-radius:50%;

    background:#eafaf0;

    color:#16a34a;

    display:flex;

    align-items:center;
    justify-content:center;

}

.success-icon svg {

    width:42px;
    height:42px;

}

.success-card h1 {

    color:#081C3A;

    margin-bottom:12px;

}

.success-card p {

    color:#64748b;

    line-height:1.7;

}

.success-btn {

    display:inline-block;

    margin-top:25px;

    padding:14px 24px;

    border-radius:14px;

    background:#2979FF;

    color:#fff;

    text-decoration:none;

    font-weight:600;

}

#paymentStatus {

    margin-top:20px;

    font-size:14px;

}

</style>

<script src="https://unpkg.com/lucide@latest"></script>

</head>


<body>

<div class="success-page">

    <div class="success-card">

        <div class="success-icon">

            <i data-lucide="shield-check"></i>

        </div>

        <h1>
            Payment Successful 🎉
        </h1>

        <p>
            We're confirming your Premium subscription.
            Please wait a moment.
        </p>

        <div id="paymentStatus">
            Verifying payment...
        </div>

        <a
            href="premium.html"
            class="success-btn"
            id="continueBtn"
            style="display:none;"
        >
            Continue to Premium
        </a>

    </div>

</div>


<script type="module"
    src="js/premium-success.js">
</script>


<script>

if (window.lucide) {

    lucide.createIcons();

}

</script>

</body>

</html>
