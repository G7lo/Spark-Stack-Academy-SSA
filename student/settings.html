<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
Student Settings | Spark Stack Academy
</title>

<link
rel="stylesheet"
href="settings.css">

</head>

<body>

<div class="dashboard-layout">

    <aside id="sidebarContainer"></aside>

    <div id="sidebarOverlay"></div>

    <main class="main-content">

        <header id="topbarContainer"></header>


        <section class="settings-page">

            <div class="page-title">

                <h1>
                    ⚙️ Settings
                </h1>

                <p>
                    Manage your Spark Stack Academy account.
                </p>

            </div>


            <!-- PROFILE -->

            <section class="settings-card">

                <h2>
                    👤 My Profile
                </h2>

                <div class="profile-area">

                    <div class="avatar">

                        <img
                        id="profileImage"
                        src="../assets/images/default-avatar.png"
                        alt="Profile">

                    </div>

                    <button
                    id="changePhotoBtn">

                        Change Photo

                    </button>

                </div>

                <div class="form-grid">

                    <div class="form-group">

                        <label>

                            Full Name

                        </label>

                        <input
                        id="fullName"
                        type="text">

                    </div>

                    <div class="form-group">

                        <label>

                            Email

                        </label>

                        <input
                        id="email"
                        type="email"
                        readonly>

                    </div>

                    <div class="form-group">

                        <label>

                            Admission Number

                        </label>

                        <input
                        id="admissionNumber"
                        readonly>

                    </div>

                    <div class="form-group">

                        <label>

                            Bio

                        </label>

                        <textarea
                        id="bio"
                        rows="4"></textarea>

                    </div>

                </div>

                <button
                id="saveProfileBtn"
                class="primary-btn">

                    💾 Save Changes

                </button>

            </section>



            <!-- ACADEMIC -->

            <section class="settings-card">

                <h2>

                    🎓 Academic Summary

                </h2>

                <div class="stats-grid">

                    <div class="stat-box">

                        <h3 id="coursesCount">

                            0

                        </h3>

                        <span>

                            Courses

                        </span>

                    </div>

                    <div class="stat-box">

                        <h3 id="lessonsCount">

                            0

                        </h3>

                        <span>

                            Lessons

                        </span>

                    </div>

                    <div class="stat-box">

                        <h3 id="certificateCount">

                            0

                        </h3>

                        <span>

                            Certificates

                        </span>

                    </div>

                    <div class="stat-box">

                        <h3 id="progressCount">

                            0%

                        </h3>

                        <span>

                            Progress

                        </span>

                    </div>

                </div>

            </section>



            <!-- SECURITY -->

            <section class="settings-card">

                <h2>

                    🔒 Security

                </h2>

                <button
                id="resetPasswordBtn">

                    Change Password

                </button>

                <button
                id="logoutBtn"
                class="danger-btn">

                    Logout

                </button>

            </section>



            <!-- PREFERENCES -->

            <section class="settings-card">

                <h2>

                    🎨 Preferences

                </h2>

                <div class="setting-row">

<span>

🌙 Dark Mode

</span>

<label class="switch">

<input
type="checkbox"
id="darkMode">

<span></span>

</label>

</div>

                <div class="setting-row">

                    <span>

                        Notifications

                    </span>

                    <label class="switch">

                        <input
                        type="checkbox"
                        checked
                        disabled>

                        <span></span>

                    </label>

                </div>

            </section>



            <!-- ABOUT -->

            <section class="settings-card">

                <h2>

                    ℹ️ About

                </h2>

                <p>

                    Spark Stack Academy

                </p>

                <p>

                    Version 1.0

                </p>

                <p>

                    Empowering Future Innovators 🚀

                </p>

            </section>

        </section>

    </main>

</div>

<script
type="module"
src="components/sidebar.js"></script>

<script
type="module"
src="components/topbar.js"></script>

<script src="../js/theme.js"></script>

<script
type="module"
src="settings.js"></script>


</body>

</html>
