<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">


<title>
New Chat | Spark Stack Academy
</title>


<link rel="stylesheet" href="css/student-core.css">

<link rel="stylesheet" href="css/components.css">

<link rel="stylesheet" href="css/new-chat.css">

<link rel="stylesheet" href="css/responsive.css">



<link rel="preconnect"
href="https://fonts.googleapis.com">


<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>


<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
rel="stylesheet">


<script src="https://unpkg.com/lucide@latest"></script>


</head>



<body>



<!-- FULL SCREEN PAGE -->


<div class="new-chat-page">



<header class="new-chat-header">


<button
id="backBtn"
class="back-btn">


<i data-lucide="arrow-left"></i>


</button>



<div>


<h1>

New Chat

</h1>


<p>

Find students, instructors and staff

</p>


</div>



</header>





<!-- SEARCH -->


<div class="user-search">


<i data-lucide="search"></i>


<input

id="searchUsers"

type="search"

placeholder="Search users...">


</div>






<!-- USERS -->


<section

id="userList"

class="user-list">


</section>






<!-- EMPTY -->

<div
id="noUsers"
class="no-users">


<i data-lucide="users"></i>


<h2>

No users found

</h2>


<p>

Search for someone to start chatting.

</p>


</div>




</div>






<script
type="module"
src="js/student-app.js">
</script>


<script
type="module"
src="js/messages/new-chat.js">
</script>



<script>

lucide.createIcons();

</script>



</body>

</html>
