<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Student Dashboard | Spark Stack Academy</title>

<link rel="stylesheet" href="dashboard.css">

</head>

<body>

<div class="dashboard-layout">

<div id="sidebarContainer"></div>

<main class="student-dashboard">

<button id="menuBtn" class="menu-btn">
☰
</button>

<header class="student-header">

<h1>
Welcome to Spark Stack Academy 🎓
</h1>

<p>
Your learning journey starts here.
</p>

</header>



<section class="student-profile">

<div class="profile-avatar">
👨‍💻
</div>

<div class="profile-info">

<h2 id="studentName">
Loading...
</h2>

<p id="studentLevel">
SSA Learner
</p>

<span class="badge">
Active Student
</span>

</div>

</section>



<section class="student-cards">

<div class="student-card">

<h3>Courses</h3>

<p id="courseCount">
0 Enrolled
</p>

</div>

<div class="student-card">

<h3>Progress</h3>

<p id="progressCount">
0% Complete
</p>

</div>

<div class="student-card">

<h3>Certificates</h3>

<p id="certificateCount">
0 Earned
</p>

</div>

</section>



<section class="recent-learning">

<h2>
Continue Learning
</h2>

<div
id="continueLearning"
class="empty-state">

Loading courses...

</div>

</section>



<section class="course-progress">

<h2>
My Learning Progress
</h2>

<div id="progressList">

Loading progress...

</div>

</section>

</main>

</div>

<script
src="components/sidebar.js">
</script>

<script type="module" src="dashboard.js"></script>

</body>

</html>
