<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SSA | Student Dashboard</title>


<link rel="stylesheet" href="dashboard.css">
<link rel="stylesheet" href="components/sidebar.css">

</head>


<body>


<div class="dashboard-layout">


<aside id="sidebarContainer"></aside>


<main class="student-dashboard">


    <div id="topbarContainer"></div>





        <!-- WELCOME HEADER -->

        <section class="student-header">

            <h1>
                Welcome back 👋
            </h1>

            <p>
                Continue your learning journey at Spark Stack Academy.
            </p>

        </section>






        <!-- STUDENT PROFILE -->

        <section class="student-profile">


            <div class="profile-avatar" id="studentAvatar">

                S

            </div>



            <div class="profile-info">

    <h2 id="studentName">
        Student Name
    </h2>


    <p id="studentEmail">
        student@email.com
    </p>


    <p id="studentAdmission">
        Admission No: Loading...
    </p>


    <span class="badge">
        Student
    </span>

</div>


        </section>







        <!-- DASHBOARD STATS -->

        <section class="student-cards">


            <div class="student-card">


                <h3>
                    My Courses
                </h3>


                <p id="courseCount">
                    0
                </p>


            </div>





            <div class="student-card">


                <h3>
                    Completed Lessons
                </h3>


                <p id="lessonCount">
                    0
                </p>


            </div>





            <div class="student-card">


                <h3>
                    Progress
                </h3>


                <p id="progressPercent">
                    0%
                </p>


            </div>



        </section>







        <!-- RECENT LEARNING -->


        <section class="recent-learning">


            <h2>
                Recent Learning
            </h2>


            <div id="recentLessons" class="empty-state">


                No lessons started yet.


            </div>



        </section>







        <!-- COURSE PROGRESS -->


        <section class="course-progress">


            <h2>
                Course Progress
            </h2>



            <div class="progress-card">


                <div class="progress-bar">


                    <div 
                    class="progress-fill"
                    id="progressBar">
                    </div>


                </div>


            </div>


        </section>





    </main>


</div>






<script src="https://unpkg.com/lucide@latest"></script>

<script src="components/sidebar.js"></script>

<script src="components/topbar.js"></script>

<script type="module" src="dashboard.js"></script>



</body>


</html>
