<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SSA | Course Player</title>

<link rel="stylesheet" href="course-player.css">

</head>


<body>


<div class="player-page">


<header class="player-header">

<h1 id="courseTitle">
Loading course...
</h1>

<p id="courseSubtitle"></p>

</header>



<div class="player-layout">


<!-- LESSONS SIDEBAR -->

<aside class="lessons-panel">

<h2>
📚 Lessons
</h2>


<div id="lessonsList">

<p>
Loading lessons...
</p>

</div>


</aside>




<!-- MAIN PLAYER -->

<main class="content-panel">


<div id="videoContainer" class="video-box">

<p>
Select a lesson to start learning.
</p>

</div>




<section class="lesson-info">


<h2 id="lessonTitle">

</h2>


<p id="lessonDescription">

</p>



<a 
id="resourceLink"
target="_blank">

</a>



<button id="completeBtn">

✓ Mark Lesson Complete

</button>


</section>


</main>


</div>


</div>



<script type="module" src="course-player.js"></script>


</body>

</html>
