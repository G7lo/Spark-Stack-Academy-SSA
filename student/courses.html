<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        My Courses | Spark Stack Academy
    </title>


    <!-- =========================
         CORE
    ========================== -->

    <link
        rel="stylesheet"
        href="css/student-core.css"
    >

    <link
        rel="stylesheet"
        href="css/components.css"
    >

    <link
        rel="stylesheet"
        href="css/courses.css"
    >

    <link
        rel="stylesheet"
        href="css/responsive.css"
    >


    <!-- =========================
         FONT
    ========================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >


    <!-- =========================
         ICONS
    ========================== -->

    <script
        src="https://unpkg.com/lucide@latest">
    </script>

</head>


<body>


<div class="student-layout">


    <!-- =========================
         SIDEBAR
    ========================== -->

    <aside
        id="sidebarContainer"
        class="sidebar-container"
    ></aside>


    <div
        id="sidebarOverlay"
        class="sidebar-overlay"
    ></div>


    <!-- =========================
         MAIN
    ========================== -->

    <main class="student-main">


        <!-- =========================
             TOPBAR
        ========================== -->

        <div
            id="topbarContainer"
            class="topbar-container"
        ></div>


        <!-- =========================
             PAGE
        ========================== -->

        <section class="dashboard-content courses-page">


            <!-- =========================
                 HEADER
            ========================== -->

            <header class="courses-hero">


                <div class="courses-hero-content">


                    <span class="page-badge">

                        <i data-lucide="graduation-cap"></i>

                        Learning Hub

                    </span>


                    <h1>

                        My Courses

                    </h1>


                    <p>

                        Continue learning, track your progress,
                        and build your future.

                    </p>


                </div>


                <a
                    href="course-library.html"
                    class="primary-btn"
                    id="exploreCoursesBtn"
                >

                    <i data-lucide="compass"></i>

                    Explore Courses

                </a>


            </header>


            <!-- =========================
                 STATS
            ========================== -->

            <section
                class="course-stats"
                aria-label="Course statistics"
            >


                <article class="course-stat-card">

                    <div class="stat-icon">

                        <i data-lucide="book-open"></i>

                    </div>

                    <div>

                        <span>
                            Enrolled
                        </span>

                        <strong id="enrolledCount">
                            0
                        </strong>

                    </div>

                </article>


                <article class="course-stat-card">

                    <div class="stat-icon">

                        <i data-lucide="play-circle"></i>

                    </div>

                    <div>

                        <span>
                            In Progress
                        </span>

                        <strong id="progressCount">
                            0
                        </strong>

                    </div>

                </article>


                <article class="course-stat-card">

                    <div class="stat-icon">

                        <i data-lucide="check-circle"></i>

                    </div>

                    <div>

                        <span>
                            Completed
                        </span>

                        <strong id="completedCount">
                            0
                        </strong>

                    </div>

                </article>


                <article class="course-stat-card">

                    <div class="stat-icon">

                        <i data-lucide="clock-3"></i>

                    </div>

                    <div>

                        <span>
                            Learning Hours
                        </span>

                        <strong id="hoursCount">
                            0h
                        </strong>

                    </div>

                </article>


            </section>


            <!-- =========================
                 COURSES SECTION
            ========================== -->

            <section class="my-courses-section">


                <div class="section-header">


                    <div>

                        <span class="section-eyebrow">
                            YOUR CLASSROOM
                        </span>

                        <h2>
                            Continue Learning
                        </h2>

                    </div>


                    <span
                        id="myCoursesCount"
                        class="course-count"
                    >
                        0 courses
                    </span>


                </div>


                <!-- =========================
                     COURSE GRID
                ========================== -->

                <div
                    id="coursesContainer"
                    class="courses-grid"
                >


                    <div class="courses-state loading-state">


                        <div class="state-icon">

                            <i data-lucide="loader-circle"></i>

                        </div>


                        <h3>
                            Loading your courses...
                        </h3>


                        <p>
                            Preparing your learning dashboard.
                        </p>


                    </div>


                </div>


            </section>


        </section>


    </main>


</div>


<!-- =========================
     SCRIPTS
========================== -->

<script
    type="module"
    src="js/student-app.js"
></script>


<script
    type="module"
    src="js/courses.js"
></script>


<script>

document.addEventListener(
    "DOMContentLoaded",
    () => {

        if (
            window.lucide &&
            typeof window.lucide.createIcons ===
                "function"
        ) {

            window.lucide.createIcons();

        }

    }
);

</script>


</body>

</html>
