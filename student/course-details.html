<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
Course Details | Spark Stack Academy
</title>



<link rel="stylesheet" href="css/student-core.css">

<link rel="stylesheet" href="css/components.css">

<link rel="stylesheet" href="css/course-details.css">

<link rel="stylesheet" href="css/responsive.css">



<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">


<script src="https://unpkg.com/lucide@latest"></script>


</head>



<body>



<div class="student-layout">



<!-- SIDEBAR -->

<aside
id="sidebarContainer"
class="sidebar-container">

</aside>



<div 
id="sidebarOverlay"
class="sidebar-overlay">

</div>







<main class="student-main">



<div
id="topbarContainer"
class="topbar-container">

</div>








<section class="dashboard-content course-details-page">





<!-- HERO -->


<div class="course-hero">



<div class="course-hero-content">



<span class="page-badge">

<i data-lucide="graduation-cap"></i>

Course Preview

</span>




<h1 id="courseTitle">

Course Title

</h1>



<p id="courseDescription">

Course description.

</p>






<div class="course-tags">


<span id="courseLevel">

Beginner

</span>


<span id="courseDuration">

0 Hours

</span>



</div>



</div>






<div class="course-action-card">



<h2 id="coursePrice">

Free

</h2>



<p>

Full lifetime access

</p>




<button
id="enrollBtn"
class="primary-btn">

Enroll Now

</button>



</div>





</div>









<!-- CONTENT -->

<div class="details-grid">





<!-- CURRICULUM -->


<div class="details-card">


<h2>

Curriculum

</h2>



<div id="curriculumList">




</div>



</div>









<!-- SIDE INFO -->


<div class="details-card">



<h2>

About Instructor

</h2>



<div class="instructor-card">



<div class="instructor-avatar">

S

</div>


<div>


<h4 id="instructorName">

Instructor

</h4>



<span>

Academy Instructor

</span>


</div>



</div>







<h2>

What You'll Learn

</h2>



<ul id="learningList">


</ul>




</div>






</div>








<!-- REVIEWS -->


<div class="details-card review-section">


<h2>

Student Reviews

</h2>



<div id="reviewList">


<p>

No reviews yet.

</p>


</div>



</div>






</section>





</main>



</div>








<script type="module" src="js/student-app.js"></script>

<script type="module" src="js/course-details.js"></script>



<script>

lucide.createIcons();

</script>


</body>

</html>
