<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>SSA | Course Details</title>

<link rel="stylesheet" href="course.css">
<link rel="stylesheet" href="components/sidebar.css">

</head>

<body>

<div class="dashboard-layout">

<aside id="sidebarContainer"></aside>

<main class="student-dashboard">

<div id="topbarContainer"></div>



<section class="student-header">

<h1 id="courseTitle">
Loading Course...
</h1>

<p>
Everything you need before you begin learning.
</p>

</section>



<section class="course-hero">

<div class="course-banner">

🎓

</div>



<div class="course-details">

<p id="courseDescription">

Loading description...

</p>


<div class="course-meta">

<div class="meta-card">

<strong>👨‍🏫 Instructor</strong>

<span id="courseInstructor">
Loading...
</span>

</div>


<div class="meta-card">

<strong>📚 Level</strong>

<span id="courseLevel">
Loading...
</span>

</div>


<div class="meta-card">

<strong>⏱ Duration</strong>

<span id="courseDuration">
Loading...
</span>

</div>


<div class="meta-card">

<strong>🎬 Lessons</strong>

<span id="courseLessons">
Loading...
</span>

</div>

</div>


<button id="enrollBtn">

Enroll Now 🚀

</button>

</div>

</section>





<section class="course-preview">

<h2>

What You'll Learn

</h2>

<div id="modulesPreview">

<p>

Modules will appear here...

</p>

</div>

</section>

</main>

</div>


<script src="https://unpkg.com/lucide@latest"></script>

<script src="components/sidebar.js"></script>

<script src="components/topbar.js"></script>

<script type="module" src="course.js"></script>

</body>

</html>
