<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Course | Spark Stack Academy</title>

<link rel="stylesheet" href="../css/style.css">

</head>


<body>


<div class="course-page">


    <h1 id="courseTitle">
        Loading...
    </h1>


    <p id="courseDescription"></p>


    <div class="course-info">

        <p>
            Instructor:
            <span id="courseInstructor"></span>
        </p>


        <p>
            Duration:
            <span id="courseDuration"></span>
        </p>


        <p>
            Lessons:
            <span id="courseLessons"></span>
        </p>


        <p>
            Level:
            <span id="courseLevel"></span>
        </p>


    </div>


    <button id="enrollBtn">
        Enroll Now
    </button>


</div>


<script type="module" src="course.js"></script>


</body>

</html>
