<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Admin Dashboard | Spark Stack Academy</title>


<link rel="stylesheet" href="dashboard.css">


<!-- Lucide Icons -->
<script src="https://unpkg.com/lucide@latest"></script>


</head>


<body>


<div class="dashboard-layout">


<!-- SIDEBAR -->

<aside id="sidebarContainer"></aside>


<div id="sidebarOverlay"></div>



<!-- MAIN -->

<main class="main-content">



<!-- TOPBAR -->

<div id="topbarContainer"></div>




<section class="dashboard-page">



<div class="page-header">

<div>

<h1 id="pageTitle">
Admin Dashboard
</h1>

<p>
Welcome back, <span id="adminName">Admin</span>
</p>

</div>


</div>





<!-- STAT CARDS -->

<div class="stats-grid">



<div class="stat-card">

<div class="icon">
<i data-lucide="users"></i>
</div>


<div>

<h3>
Students
</h3>


<h2 id="studentCount">
0
</h2>


</div>


</div>






<div class="stat-card">

<div class="icon">
<i data-lucide="book-open"></i>
</div>


<div>

<h3>
Courses
</h3>


<h2 id="courseCount">
0
</h2>


</div>


</div>







<div class="stat-card">

<div class="icon">
<i data-lucide="user-plus"></i>
</div>


<div>

<h3>
Admissions
</h3>


<h2 id="applicationCount">
0
</h2>


</div>


</div>






<div class="stat-card">

<div class="icon">
<i data-lucide="graduation-cap"></i>
</div>


<div>

<h3>
Instructors
</h3>


<h2 id="instructorCount">
0
</h2>


</div>


</div>



</div>






<!-- CONTENT GRID -->

<div class="dashboard-grid">



<div class="panel">

<h2>
Recent Admissions
</h2>


<div id="recentAdmissions">

<p>
Loading...
</p>

</div>


</div>






<div class="panel">

<h2>
Quick Actions
</h2>


<div class="actions">


<a href="admissions.html">
<i data-lucide="clipboard-check"></i>
Admissions
</a>


<a href="students.html">
<i data-lucide="users"></i>
Students
</a>


<a href="courses.html">
<i data-lucide="book"></i>
Courses
</a>



</div>


</div>



</div>




</section>



</main>



</div>





<script type="module" src="js/admin-app.js"></script>

<script type="module" src="dashboard.js"></script>


</body>

</html>
