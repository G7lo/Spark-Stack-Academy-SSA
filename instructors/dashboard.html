<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Instructor Dashboard</title>

<link rel="stylesheet"
href="dashboard.css">

</head>

<body>

<div class="dashboard">

    <aside id="sidebarContainer"></aside>


    <main class="content">

        <h1 id="instructorName">
            Welcome...
        </h1>

        <div class="stats">

            <div class="card">

                <h2 id="courseTotal">
                    0
                </h2>

                <p>Courses</p>

            </div>

            <div class="card">

                <h2 id="studentTotal">
                    0
                </h2>

                <p>Students</p>

            </div>

            <div class="card">

                <h2 id="rating">
                    0.0
                </h2>

                <p>Rating</p>

            </div>

        </div>

    </main>

</div>

<script src="https://unpkg.com/lucide@latest"></script>

<script src="components/sidebar.js"></script>

<script type="module" src="dashboard.js"></script>

</body>

</html>
