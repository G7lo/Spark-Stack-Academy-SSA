<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Instructor Dashboard</title>

<link rel="stylesheet"
href="dashboard.css">

</head>

<body>

<div class="dashboard-layout">


    <aside id="sidebarContainer"></aside>

<div id="sidebarOverlay"></div>

    <main class="instructor-dashboard">


        <div id="topbarContainer"></div>

        <h1 id="instructorName">
            Welcome...
        </h1>

        <div class="stats">

            <div class="card">

                <h2 id="courseTotal">
                    0
                </h2>

                <p>Courses</p>

            </div>

            <div class="card">

                <h2 id="studentTotal">
                    0
                </h2>

                <p>Students</p>

            </div>

            <div class="card">

                <h2 id="rating">
                    0.0
                </h2>

                <p>Rating</p>

            </div>

        </div>
<section class="recent-section">

<h2>
📚 Recent Courses
</h2>

<div id="recentCourses">

<p>
Loading courses...
</p>

</div>

</section>

<section class="performance-section">

<h2>
📈 Course Performance
</h2>

<div id="performanceList">

<p>
Loading performance...
</p>

</div>

</section>

    </main>

</div>

<script src="https://unpkg.com/lucide@latest"></script>

<script type="module" src="components/sidebar.js"></script>

<script type="module" src="components/topbar.js"></script>

<script type="module" src="dashboard.js"></script>

</body>

</html>
