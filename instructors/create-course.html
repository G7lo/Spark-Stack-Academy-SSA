<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Create Course | Spark Stack Academy</title>

<link rel="stylesheet"
href="create-course.css">

</head>

<body>

<div class="dashboard-layout">

<aside id="sidebarContainer"></aside>

<div id="sidebarOverlay"></div>

<div class="main-content">

<header id="topbarContainer"></header>

<main class="create-course-page">

<header class="page-header">

<h1>

📘 Create New Course

</h1>

<p>

Build a new course for your students.

</p>

</header>

<form id="courseForm">

<div class="course-card">

<h2>

Course Information

</h2>

<div class="form-group">

<label>

Course Title

</label>

<input
type="text"
id="title"
placeholder="e.g. Web Development Basics"
required>

</div>

<div class="form-group">

<label>

Description

</label>

<textarea
id="description"
rows="6"
placeholder="Describe your course..."
required></textarea>

</div>

<div class="form-grid">

<div class="form-group">

<label>

Category

</label>

<input
type="text"
id="category"
placeholder="Programming"
required>

</div>

<div class="form-group">

<label>

Level

</label>

<select id="level">

<option>

Beginner

</option>

<option>

Intermediate

</option>

<option>

Advanced

</option>

</select>

</div>

</div>

<div class="form-grid">

<div class="form-group">

<label>

Duration

</label>

<input
type="text"
id="duration"
placeholder="8 Weeks"
required>

</div>

<div class="form-group">

<label>

Price

</label>

<input
type="number"
id="price"
placeholder="0">

</div>

</div>

</div>

<div class="course-card">

<h2>

Media

</h2>

<div class="form-group">

<label>

Course Thumbnail URL

</label>

<input
type="url"
id="thumbnail"
placeholder="https://example.com/image.jpg">

</div>

<div class="form-group">

<label>

Introduction Video (YouTube)

</label>

<input
type="url"
id="introVideo"
placeholder="https://www.youtube.com/watch?v=...">

</div>

</div>

<div class="actions">

<button
type="submit"
id="draftBtn"
class="secondary-btn">

💾 Save Draft

</button>

<button
type="button"
id="publishBtn"
class="primary-btn">

🚀 Publish Course

</button>

</div>

</form>

</main>

</div>

</div>

<script
src="https://unpkg.com/lucide@latest">
</script>

<script
type="module"
src="components/sidebar.js">
</script>

<script
type="module"
src="components/topbar.js">
</script>

<script
type="module"
src="create-course.js">
</script>

</body>

</html>
