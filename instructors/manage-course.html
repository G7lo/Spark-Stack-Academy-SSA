<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Manage Course | Spark Stack Academy</title>

<link rel="stylesheet"
href="manage-course.css">

</head>

<body>

<div class="dashboard-layout">

<aside id="sidebarContainer"></aside>

<div id="sidebarOverlay"></div>

<div class="main-content">

<header id="topbarContainer"></header>

<main class="manage-page">

<header class="page-header">

<h1 id="courseTitle">

Manage Course

</h1>

<p>

Edit your course information and manage lessons.

</p>

</header>



<div class="course-card">

<div class="section-title">

<h2>

Course Information

</h2>

</div>



<div class="form-group">

<label>Course Title</label>

<input
type="text"
id="editTitle"
disabled>

</div>



<div class="form-group">

<label>Description</label>

<textarea
id="editDescription"
rows="5"
disabled></textarea>

</div>



<div class="form-grid">

<div class="form-group">

<label>Category</label>

<input
type="text"
id="editCategory"
disabled>

</div>



<div class="form-group">

<label>Level</label>

<select
id="editLevel"
disabled>

<option>Beginner</option>

<option>Intermediate</option>

<option>Advanced</option>

</select>

</div>

</div>



<div class="form-grid">

<div class="form-group">

<label>Duration</label>

<input
type="text"
id="editDuration"
disabled>

</div>



<div class="form-group">

<label>Status</label>

<select
id="editStatus"
disabled>

<option>Draft</option>

<option>Published</option>

</select>

</div>

</div>



<div class="stats">

<div class="stat-card">

<h3>Students</h3>

<span id="students">0</span>

</div>

</div>



<div class="actions">

<button
id="editCourseBtn"
class="primary-btn">

✏️ Edit Course

</button>



<button
id="saveCourseBtn"
class="success-btn"
style="display:none;">

💾 Save Changes

</button>



<button
id="contentBtn"
class="secondary-btn">

📚 Manage Content

</button>

</div>

</div>

</main>

</div>

</div>

<script src="https://unpkg.com/lucide@latest"></script>

<script
type="module"
src="components/sidebar.js">
</script>

<script
type="module"
src="components/topbar.js">
</script>

<script
type="module"
src="manage-course.js">
</script>

</body>

</html>
