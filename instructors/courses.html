<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
SSA | My Courses
</title>

<link rel="stylesheet"
href="courses.css">

</head>


<body>


<div class="dashboard-layout">


    <aside id="sidebarContainer"></aside>


    <div id="sidebarOverlay"></div>



    <main class="main-content">


        <header id="topbarContainer"></header>



        <section class="courses-page">


            <div class="page-header">


                <div>

                    <h1>
                        📚 My Courses
                    </h1>

                    <p>
                        Manage your courses and learning content.
                    </p>

                </div>



                <button
                id="createCourseBtn"
                class="primary-btn">

                    ➕ Create Course

                </button>


            </div>




            <section class="courses-grid"
            id="coursesContainer">


                <div class="loading-card">

                    Loading courses...

                </div>


            </section>



        </section>


    </main>


</div>



<script src="https://unpkg.com/lucide@latest"></script>

<script type="module"
src="./js/instructor-app.js"></script>


<script type="module"
src="courses.js"></script>


</body>

</html>
