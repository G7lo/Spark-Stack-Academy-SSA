<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Settings | Spark Stack Academy</title>

<link rel="stylesheet"
href="settings.css">

</head>

<body>

<div class="dashboard-layout">

<aside id="sidebarContainer"></aside>

<div id="sidebarOverlay"></div>

<div class="main-content">

<header id="topbarContainer"></header>

<main class="settings-page">

<header class="page-header">

<h1>

⚙️ Settings

</h1>

<p>

Manage your instructor account and preferences.

</p>

</header>



<div class="settings-card">

<h2>

👤 Profile Information

</h2>

<div class="form-group">

<label>

Full Name

</label>

<input
type="text"
id="name">

</div>

<div class="form-group">

<label>

Email

</label>

<input
type="email"
id="email"
disabled>

</div>

<div class="form-group">

<label>

Bio

</label>

<textarea
id="bio"
rows="5">
</textarea>

</div>

<div class="form-group">

<label>

Expertise

</label>

<input
type="text"
id="expertise">

</div>

<button
id="saveProfileBtn"
class="primary-btn">

💾 Save Profile

</button>

</div>



<div class="settings-card">

<h2>

🔒 Security

</h2>

<p>

Password changes will be supported in a future update.

</p>

<button
id="changePasswordBtn"
class="secondary-btn">

Change Password

</button>

</div>



<div class="settings-card">

<h2>

🔔 Notifications

</h2>

<label class="switch">

<input
type="checkbox"
id="emailNotifications">

<span>

Email Notifications

</span>

</label>

<label class="switch">

<input
type="checkbox"
id="studentNotifications">

<span>

Student Enrollments

</span>

</label>

</div>



<div class="settings-card danger">

<h2>

🗑️ Danger Zone

</h2>

<p>

Deleting your account is permanent.

</p>

<button
id="deleteAccountBtn"
class="danger-btn">

Delete Account

</button>

</div>

</main>

</div>

</div>

<script
src="https://unpkg.com/lucide@latest">
</script>

<script
type="module"
src="components/sidebar.js">
</script>

<script
type="module"
src="components/topbar.js">
</script>

<script
type="module"
src="settings.js">
</script>

</body>

</html>
