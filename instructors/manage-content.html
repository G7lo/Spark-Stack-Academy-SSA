<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Manage Course Content</title>

<link rel="stylesheet" href="manage-content.css">

</head>

<body>

<div class="page">

<h1>📚 Course Content</h1>

<p>
Create modules and lessons for your course.
</p>

<button id="addModuleBtn">
+ Add Module
</button>

<div id="modulesList">

</div>

</div>

<!-- Add Module Modal -->

<div class="modal hidden" id="moduleModal">

<div class="modal-content">

<h2>New Module</h2>

<input
type="text"
id="moduleTitle"
placeholder="Module Title">

<button id="saveModuleBtn">
Save Module
</button>

</div>

</div>

<script type="module" src="manage-content.js"></script>

</body>

</html>
