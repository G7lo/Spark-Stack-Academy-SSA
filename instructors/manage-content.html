<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>SSA | Manage Course Content</title>

<link rel="stylesheet"
href="manage-content.css">

</head>

<body>

<div class="dashboard-layout">

    <!-- Sidebar -->
    <aside id="sidebarContainer"></aside>

    <div id="sidebarOverlay"></div>


    <!-- Main -->
    <div class="main-content">

        <header id="topbarContainer"></header>


        <main class="manage-content-page">


            <!-- Header -->

            <section class="page-header">

                <div>

                    <h1>

                        📚 Manage Course Content

                    </h1>

                    <p>

                        Organize your course into modules and lessons.

                    </p>

                </div>


                <button
                id="addModuleBtn"
                class="primary-btn">

                    ➕ Add Module

                </button>

            </section>



            <!-- Statistics -->

            <section class="stats-grid">

                <div class="stat-card">

                    <h3>

                        Modules

                    </h3>

                    <p id="moduleCount">

                        0

                    </p>

                </div>


                <div class="stat-card">

                    <h3>

                        Lessons

                    </h3>

                    <p id="lessonCount">

                        0

                    </p>

                </div>


                <div class="stat-card">

                    <h3>

                        Course Progress

                    </h3>

                    <p>

                        Ready 🚀

                    </p>

                </div>

            </section>



            <!-- Modules -->

            <section
            id="modulesList"
            class="modules-list">

                <div class="empty-state">

                    <h3>

                        Loading modules...

                    </h3>

                    <p>

                        Please wait.

                    </p>

                </div>

            </section>


        </main>

    </div>

</div>



<!-- MODULE MODAL -->

<div
id="moduleModal"
class="modal hidden">

<div class="modal-content">

<h2>

📂 Create Module

</h2>


<div class="form-group">

<label>

Module Title

</label>

<input
type="text"
id="moduleTitle"
placeholder="Module 1">

</div>


<div class="form-group">

<label>

Description

</label>

<textarea
id="moduleDescription"
rows="4"
placeholder="Short description...">

</textarea>

</div>


<div class="modal-actions">

<button
id="cancelModuleBtn"
class="secondary-btn">

Cancel

</button>

<button
id="saveModuleBtn"
class="primary-btn">

Save Module

</button>

</div>

</div>

</div>



<!-- Toast -->

<div
id="toast"
class="toast">

</div>



<script
src="https://unpkg.com/lucide@latest">

</script>

<script
type="module"
src="components/sidebar.js">

</script>

<script
type="module"
src="components/topbar.js">

</script>

<script
type="module"
src="manage-content.js">

</script>

</body>

</html>
