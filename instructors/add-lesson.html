<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Add Lesson</title>

<link rel="stylesheet"
href="add-lesson.css">

</head>

<body>

<div class="page">

<h1>Add Lesson</h1>

<form id="lessonForm">

<input
type="text"
id="title"
placeholder="Lesson Title"
required>

<textarea
id="description"
placeholder="Lesson Description"
rows="5"></textarea>

<input
type="url"
id="videoUrl"
placeholder="YouTube Video URL">

<input
type="text"
id="duration"
placeholder="Duration (e.g. 12 min)">

<button
type="submit">

Save Lesson

</button>

</form>

</div>

<script
type="module"
src="add-lesson.js">

</script>

</body>

</html>
