<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Create Lesson | Spark Stack Academy</title>

<link rel="stylesheet"
href="add-lesson.css">

</head>

<body>

<div class="dashboard-layout">

<aside id="sidebarContainer"></aside>

<div id="sidebarOverlay"></div>

<div class="main-content">

<header id="topbarContainer"></header>

<main class="create-lesson-page">

<header class="page-header">

<div>

<h1>

🎓 Create Lesson

</h1>

<p>

Create engaging lessons for your students.

</p>

</div>

</header>


<section class="stats-grid">

<div class="stat-card">

<h3>

Course

</h3>

<p>

📚 Current

</p>

</div>

<div class="stat-card">

<h3>

Module

</h3>

<p>

📂 Selected

</p>

</div>

<div class="stat-card">

<h3>

Status

</h3>

<p>

✨ Ready

</p>

</div>

</section>

<form id="lessonForm">

<div class="lesson-card">

<h2>

Lesson Details

</h2>

<div class="form-group">

<label>

Lesson Title

</label>

<input
type="text"
id="lessonTitle"
placeholder="HTML Introduction"
required>

</div>

<div class="form-group">

<label>

Video URL (YouTube)

</label>

<input
type="url"
id="videoUrl"
placeholder="https://youtube.com/...">

</div>

<div class="form-grid">

<div class="form-group">

<label>

Duration

</label>

<input
type="text"
id="duration"
placeholder="15 Minutes">

</div>

<div class="form-group">

<label>

Lesson Order

</label>

<input
type="number"
id="lessonOrder"
value="1"
min="1">

</div>

</div>

<div class="form-group">

<label>

Lesson Notes

</label>

<textarea
id="notes"
rows="7"
placeholder="Write lesson notes..."></textarea>

</div>

<div class="form-group">

<label>

Resource URL (Optional)

</label>

<input
type="url"
id="resource"
placeholder="https://...">

</div>

<div class="checkbox">

<input
type="checkbox"
id="freePreview">

<label
for="freePreview">

Allow Free Preview

</label>

</div>

<div class="actions">

<button
type="submit"
class="primary-btn">

💾 Save Lesson

</button>

</div>

</div>

</form>

</main>

</div>

</div>

<script src="https://unpkg.com/lucide@latest"></script>

<script
type="module"
src="./js/instructor-app.js">
</script>

<script
type="module"
src="add-lesson.js">
</script>

</body>

</html>
