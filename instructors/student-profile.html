<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Profile | SSA</title>

<link rel="stylesheet" href="student-profile.css">

</head>


<body>


<div class="dashboard-layout">

    <aside id="sidebarContainer"></aside>

    <div id="sidebarOverlay"></div>


    <div class="main-content">

        <header id="topbarContainer"></header>


        <div class="profile-page">

            <div class="page-header">

                <h1>
                    Student Profile
                </h1>

                <p>
                    View student progress and enrolled courses
                </p>

            </div>


            <div class="profile-card">


                <div class="avatar">

                    👨‍🎓

                </div>


                <div>

                    <h2 id="studentName">
                        Loading...
                    </h2>


                    <p id="studentEmail"></p>


                    <span id="studentAdmission"></span>

                </div>


            </div>


            <section class="stats-grid">


                <div class="stat-card">

                    <h3>
                        Courses
                    </h3>

                    <p id="courseCount">
                        0
                    </p>

                </div>



                <div class="stat-card">

                    <h3>
                        Progress
                    </h3>

                    <p id="averageProgress">
                        0%
                    </p>

                </div>



                <div class="stat-card">

                    <h3>
                        Status
                    </h3>

                    <p id="studentStatus">
                        Active
                    </p>

                </div>


            </section>



            <div class="courses-card">

                <h2>
                    Enrolled Courses
                </h2>


                <div id="coursesList">

                </div>


            </div>


        </div>


    </div>

</div>



<script src="https://unpkg.com/lucide@latest"></script>

<script type="module" src="./js/instructor-app.js"></script>

<script type="module" src="student-profile.js"></script>


</body>

</html>
