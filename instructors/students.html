<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Instructor Students | SSA</title>

<link rel="stylesheet" href="students.css">

</head>


<body>


<div class="dashboard-layout">


<aside id="sidebarContainer"></aside>


<div class="main-content">


<div class="students-page">


<div class="page-header">

<h1>My Students</h1>

<p>Manage students enrolled in your courses</p>

</div>



<div class="stats-grid">


<div class="stat-card">

<h3>Total Students</h3>
<p id="totalStudents">0</p>

</div>


<div class="stat-card">

<h3>Total Courses</h3>
<p id="totalCourses">0</p>

</div>


<div class="stat-card">

<h3>Active Students</h3>
<p id="activeStudents">0</p>

</div>


</div>




<div class="table-card">


<div class="table-header">

<h2>Student Enrollment</h2>


<input 
type="text"
id="searchStudent"
placeholder="Search student..."
>


</div>



<div class="table-wrapper">


<table>


<thead>

<tr>

<th>#</th>

<th>Admission No</th>

<th>Student</th>

<th>Courses</th>

<th>Status</th>

<th>Action</th>

</tr>

</thead>


<tbody id="studentsTable">


</tbody>


</table>


</div>


</div>



</div>


</div>


</div>


<script type="module" src="students.js"></script>

</body>

</html>
