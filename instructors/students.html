<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
SSA | Instructor Students
</title>

<link rel="stylesheet" href="students.css">

</head>


<body>


<div class="dashboard-layout">


    <aside id="sidebarContainer"></aside>


    <div id="sidebarOverlay"></div>



    <main class="main-content">


        <header id="topbarContainer"></header>



        <section class="students-page">


            <div class="page-header">


                <div>

                    <h1>
                        👨‍🎓 My Students
                    </h1>


                    <p>
                        Manage students enrolled in your courses.
                    </p>

                </div>


            </div>





            <!-- STATS -->

            <section class="stats-grid">


                <div class="stat-card">

                    <h3>
                        Total Students
                    </h3>

                    <p id="totalStudents">
                        0
                    </p>

                </div>




                <div class="stat-card">

                    <h3>
                        Total Courses
                    </h3>

                    <p id="totalCourses">
                        0
                    </p>

                </div>





                <div class="stat-card">

                    <h3>
                        Active Students
                    </h3>

                    <p id="activeStudents">
                        0
                    </p>

                </div>



            </section>






            <!-- TABLE -->

            <section class="table-card">



                <div class="table-header">


                    <h2>
                        📋 Student Enrollment
                    </h2>



                    <input
                    type="text"
                    id="searchStudent"
                    placeholder="Search student..."
                    >


                </div>





                <div class="table-wrapper">


                    <table>


                        <thead>

                        <tr>

                        <th>#</th>

                        <th>
                        Admission No
                        </th>


                        <th>
                        Student
                        </th>


                        <th>
                        Courses
                        </th>


                        <th>
                        Status
                        </th>


                        <th>
                        Action
                        </th>


                        </tr>

                        </thead>



                        <tbody id="studentsTable">


                        </tbody>



                    </table>


                </div>



            </section>




        </section>



    </main>


</div>




<script src="https://unpkg.com/lucide@latest"></script>

<script type="module" src="./js/instructor-app.js"></script>

<script type="module" src="students.js"></script>


</body>

</html>
