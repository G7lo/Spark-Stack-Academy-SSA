<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SSA Notification Test</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 30px;
            background: #f5f7fb;
        }

        .box {
            max-width: 500px;
            margin: 40px auto;
            padding: 30px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,.1);
        }

        button {
            display: block;
            width: 100%;
            padding: 15px;
            border: 0;
            border-radius: 10px;
            background: #2979ff;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        pre {
            margin-top: 20px;
            white-space: pre-wrap;
        }
    </style>
</head>

<body>

<div class="box">

    <h2>🔔 SSA Notification Test</h2>

    <p>Test the global notification system.</p>

    <button id="runTest">
        🚀 Create Notification
    </button>

    <pre id="output">Waiting...</pre>

</div>


<script type="module">

import { notifyAll }
    from "./js/notifications.js";


const output =
    document.getElementById("output");


document
    .getElementById("runTest")
    .addEventListener("click", async () => {

        output.textContent =
            "🚀 Creating notification...";


        try {

            const id =
                await notifyAll({

                    title:
                        "🔧 Test Maintenance",

                    message:
                        "This is a notification engine test.",

                    type:
                        "maintenance",

                    priority:
                        "high"

                });


            output.textContent =
                "✅ SUCCESS!\n\n" +
                "Notification ID:\n" +
                id;


        } catch (error) {

            console.error(error);

            output.textContent =
                "❌ FAILED\n\n" +
                "Code: " +
                (error.code || "unknown") +
                "\n\nMessage:\n" +
                error.message;

        }

    });

</script>

</body>

</html>
